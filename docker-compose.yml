# ──────────────────────────────────────────────
# Docker Compose
#
# Services:
#   1. embeddings — Python FastEmbed + ChromaDB sidecar
#   2. app        — Node.js Express backend
#
# Named volumes (chroma_data & uploads_data) ensure data
# persists across `docker compose down` and container restarts.
# ──────────────────────────────────────────────

services:
  # ── Python Embedding & ChromaDB Server ──────
  embeddings:
    container_name: campuscare-embeddings
    build:
      context: ./python-embeddings
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    volumes:
      # Persist ChromaDB data persistently
      - chroma_data:/app/chroma_db
      # Persist & share uploaded media
      - uploads_data:/app/uploads

  # ── Node.js Express Backend ──────────────────
  app:
    container_name: campuscare-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      EMBEDDING_SERVICE_URL: http://embeddings:5050
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY}
      DAUTH_CLIENT_ID: ${DAUTH_CLIENT_ID}
      DAUTH_CLIENT_SECRET: ${DAUTH_CLIENT_SECRET}
      DAUTH_REDIRECT_URI: ${DAUTH_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      # Persist uploaded media
      - uploads_data:/app/src/uploads
    depends_on:
      - embeddings

volumes:
  chroma_data:
    driver: local
  uploads_data:
    driver: local
